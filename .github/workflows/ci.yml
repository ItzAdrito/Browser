name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  quality-and-test:
    name: Lint, Type Check & Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies (Linux Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1-mesa-glx libxkbcommon0 libdbus-1-3 xvfb

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Ruff Linter Check
        run: python -m ruff check .

      - name: Ruff Code Formatting Check
        run: python -m ruff format --check .

      - name: Mypy Static Type Checking
        run: python -m mypy src/

      - name: Run Pytest Suite (Linux with Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run python -m pytest tests/

      - name: Run Pytest Suite (Windows/macOS)
        if: runner.os != 'Linux'
        run: python -m pytest tests/
